  url: "https://git-scm.com"

- name: Python
  logo: "/images/skills/python.svg"
  summary: "Dynamische Skriptsprache, die von mir meist im akademischen Kontext bevorzugt wird, wegen hoher Wartbarkeit und Verständnis durch Forscher*innen."
  categories: ["language"]
  url: "https://python.org"
  
- name: Nextflow
  logo: "/images/projects/nextflow.png"
  summary: "Workflow Skriptsprache mit Fokus auf Reproduzierbarkeit. Geschrieben in Groovy."
  categories: ["tool"]
  url: https://www.nextflow.io/

- name: Gradle
  logo: "/images/skills/gradle.svg"
  summary: "Build Werkzeug für Java-basierte Projekte (inkl. Groovy, Kotlin)."
  categories: ["tool"]
  url: https://gradle.org/

- name: Java
  logo: "/images/skills/java.svg"
  summary: "Vielleicht am weitesten verbreitet im Raum der praktischen objektorientierten Sprachen mit einer gewissen Abstraktion."
  categories: ["language"]
  url: https://java.com

- name: Groovy
  logo: "/images/skills/groovy.svg"
  summary: "Java mit syntaktischem Zucker und einem Hand das typing zu unterlassen."
  categories: ["language"]
  url: https://groovy-lang.org/

- name: R
  logo: "/images/skills/r.svg"
  summary: "Mathematisch formulierte Programmiersprache für statistische Operationen."
  categories: ["language"]
  url: https://www.r-project.org/

- name: "Javascript / Typescript"
  logo: "/images/skills/javascript.svg"
