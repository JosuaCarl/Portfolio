  categories: ["language"]
  url: https://developer.mozilla.org/en-US/docs/Web/JavaScript

- name: Markdown
  logo: "/images/skills/markdown.svg"
  summary: "Markupsparache für schnelle Notizen (Quarkdown ist auch ein interessantes Projekt, dass die Grenzen zwischen Markdown und LaTex angeht)."
  categories: ["markup"]
  url: https://markdown.org/

- name: LaTex
  logo: "/images/skills/latex.svg"
  summary: "Typesettingsprache für komplex designte Dokumente."
  categories: ["markup"]
  url: https://www.latex-project.org/

- name: SLURM
  logo: ""
  summary: "Cluster scheduler mit Fairness Funktionen für gemeinschaftliche Ressourcennutzung."
  categories: ["tool"]
  url: https://slurm.schedmd.com/

- name: scikit-learn
  logo: "/images/skills/sk-learn.svg"
  summary: "Machine-learning framework mit großer Bandbreite."
  categories: ["tool"]
  url: https://scikit-learn.org

- name: keras
  logo: "/images/skills/keras.svg"
  summary: "Deep learning framework das eine höhere Abstraktion aufweist und auch Tensorflow / PyTorch zurückgreift."
  categories: ["tool"]
  url: https://keras.io/

- name: Docker
  logo: "/images/skills/docker.svg"
  summary: "Containersystem für Programme das Kompatibilitätsprobleme durch gleich bleibende Virtualisierungsumgebungen angeht."
  categories: ["container"]
  url: "https://www.docker.com/"

- name: Linux
  logo: "/images/skills/linux.svg"
  summary: "Mein Lieblings OS, dass ich privat verwende. User haben die volle Kontrolle. Ich bin auf CachyOS nach mehreren Versuchen hängen geblieben."
  categories: ["os"]
  url: https://en.wikipedia.org/wiki/Linux
